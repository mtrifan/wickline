# Keeps the self-hosted edition's pinned dependencies current. Deliberately excludes the root
# npm package (upstream's package.json): upstream releases manage it, and editing it here would
# break the no-upstream-changes rule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /selfhost
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
