# Raises an issue when the daily upstream sync has not completed for 3 days: GitHub disables
# scheduled workflows in public repositories after 60 days without activity, and SYNC_TOKEN expires.
name: selfhost-sync-watchdog

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the last successful sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LAST_OK: ${{ vars.UPSTREAM_SYNC_LAST_OK }}
        run: |
          now=$(date -u +%s)
          last=$( [ -n "$LAST_OK" ] && date -u -d "$LAST_OK" +%s 2>/dev/null || echo 0 )
          age_h=$(( (now - last) / 3600 ))
          echo "last successful sync: ${LAST_OK:-never} (${age_h}h ago)"
          [ "$age_h" -lt 72 ] && exit 0
          title="Upstream sync has not succeeded for 3+ days"
          open=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "issue already open"; exit 0
          fi
          gh issue create --repo "$REPO" --title "$title" --body "Last successful run of \`selfhost-upstream-sync\`: ${LAST_OK:-never}.

          Check, in order: the workflow is enabled (Actions tab; GitHub disables schedules after 60 days of inactivity), the \`SYNC_TOKEN\` secret has not expired, and the latest run's logs. See UPSTREAM.md."
