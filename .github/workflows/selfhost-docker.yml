# Container image: every PR builds it and runs the smoke test (hardened run, health, login,
# graceful stop, restart persistence). Pushes to the production branch publish multi-arch images
# to GHCR as :edge and :sha-<short>. Release tags are published by selfhost-release, which also calls
# this workflow for the smoke test (publish stays off then: it runs only for pushes to the branch).
name: selfhost-docker

on:
  pull_request:
  push:
    branches: [selfhosted]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: selfhost-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wickline

jobs:
  smoke:
    name: image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: selfhost/Dockerfile
          load: true
          tags: wickline-selfhost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          bytes=$(docker image inspect wickline-selfhost:ci --format '{{.Size}}')
          echo "image size: $((bytes / 1024 / 1024)) MB"
          [ "$bytes" -lt $((250 * 1024 * 1024)) ] || { echo "::error::image larger than 250 MB"; exit 1; }
      - name: Smoke test
        env:
          IMAGE: wickline-selfhost:ci
        run: selfhost/test/docker/smoke.sh

  publish:
    name: publish edge image
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/selfhosted'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Versions
        id: v
        run: |
          echo "upstream=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "rev=$(tr -d '[:space:]' < selfhost/VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false # :latest moves only through an approved release
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: selfhost/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_VERSION=${{ steps.v.outputs.upstream }}
            SELFHOST_REVISION=${{ steps.v.outputs.rev }}
            GIT_SHA=${{ steps.v.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
