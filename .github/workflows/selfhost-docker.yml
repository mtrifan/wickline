# Container image: every PR builds it and runs the smoke test (hardened run, health, login,
# graceful stop, restart persistence). Pushes to the production branch publish multi-arch images
# to GHCR as :edge and :sha-<short>. Release tags (:<upstream>-sh.<rev>, :stable) come in Phase 4.
name: selfhost-docker

on:
  pull_request:
  push:
    branches: [selfhosted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wickline

jobs:
  smoke:
    name: image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/Dockerfile
          load: true
          tags: wickline-selfhost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          bytes=$(docker image inspect wickline-selfhost:ci --format '{{.Size}}')
          echo "image size: $((bytes / 1024 / 1024)) MB"
          [ "$bytes" -lt $((260 * 1024 * 1024)) ] || { echo "::error::image larger than 260 MB"; exit 1; }
      - name: Smoke test
        env:
          IMAGE: wickline-selfhost:ci
        run: selfhost/test/docker/smoke.sh

  publish:
    name: publish edge image
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/selfhosted'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Versions
        id: v
        run: |
          echo "upstream=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "rev=$(tr -d '[:space:]' < selfhost/VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_VERSION=${{ steps.v.outputs.upstream }}
            SELFHOST_REVISION=${{ steps.v.outputs.rev }}
            GIT_SHA=${{ steps.v.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
